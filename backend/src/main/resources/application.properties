# Application Configuration
spring.application.name=music-catalog-backend
server.port=${PORT:8080}

# H2 In-Memory Database (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:musicdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Caffeine In-Memory Cache (iTunes Search Proxy)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=10m

# Security & JWT Token Configuration
app.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3a5f8e0c2b4a6d8f1e3c5a7b9d1e3f5a7c9b1d3e5f7a9b1c3d5e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
